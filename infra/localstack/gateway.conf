# Authenticating gateway in front of the MiniStack broker (REQ-062, D12).
#
# MiniStack enforces IAM only for named IAM users. It always treats the access
# key "test", an empty/unsigned request, any 12-digit key and its own root key
# as root, and it serves unauthenticated admin endpoints under /_ministack/.
# The broker is therefore reachable only through this gateway, which forwards a
# request only when it is signed with a provisioned IAM user key (AKIA...) and
# lets MiniStack enforce that user's identity and queue policies.
#
# Limitation: MiniStack does not verify the SigV4 signature, so an AKIA access
# key id acts as the bearer credential. Real SQS verifies the signature.

map $http_authorization $broker_signed_by_iam_user {
    default 0;
    "~^AWS4-HMAC-SHA256 Credential=AKIA[0-9A-Z]{16}/" 1;
}

server {
    listen 4566;
    server_name _;

    # Unauthenticated status endpoint, used by healthchecks only.
    location = /_localstack/health {
        limit_except GET { deny all; }
        proxy_pass http://localstack:4566;
    }

    # Broker admin endpoints (state reset, message dumps, config) are never exposed.
    location /_ {
        return 403 "forbidden\n";
    }

    location / {
        limit_except POST { deny all; }
        if ($broker_signed_by_iam_user = 0) {
            return 403 '{"__type":"MissingAuthenticationToken","message":"requests must be signed with a provisioned broker identity"}\n';
        }
        # Credentials in the query string would bypass the header check.
        if ($args ~* "x-amz-credential|x-amz-security-token") {
            return 403 "forbidden\n";
        }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Forward exactly the one validated Authorization header.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 70s;
        proxy_pass http://localstack:4566;
    }
}
