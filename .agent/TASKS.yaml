schema_version: 1
phase: implementation
status: active
specification: SPEC.md
execution_policy:
  create_workers_now: true
  implement_code_now: true
  push_remote_now: false
  parallelism_rule: Run tasks together only when dependencies are done and file ownership is separate.
tasks:
- id: T01
  title: Bootstrap Go, configuration and Fx lifecycle
  depends_on: []
  parallel_group: foundation
  owner_area: go.mod, cmd/, internal/bootstrap/, internal/config/
  deliverables: Pinned Go version, Fx modules, validated configuration, lifecycle start/stop skeleton
  done_when: Fx starts and stops cleanly with configuration validation and resource ordering checks
  agent: codex
  model_tier: standard
  reasoning_effort: medium
- id: T02
  title: Design and migrate PostgreSQL schema
  depends_on: []
  parallel_group: foundation
  owner_area: migrations/, internal/storage/schema/
  deliverables: Up/down migrations for wallets, transactions, ledger, inbox, outbox, leases, indexes, constraints
    and triggers
  done_when: Migration reversal works; SQL rejects duplicate opening, negative balance, invalid ledger equation,
    update/delete ledger and conflicting unique keys
  agent: claude
  model_tier: standard
  reasoning_effort: high
  actual_model: Sonnet 5.5
- id: T03
  title: Implement domain model and typed events
  depends_on: []
  parallel_group: foundation
  owner_area: internal/domain/
  deliverables: Money, Wallet, WagerTransaction, ledger entry, inbox/outbox event types, transitions and typed errors
  done_when: Constructors and rehydration preserve invariants; no float arithmetic; opening and five external kinds
    have explicit rules
  agent: claude
  model_tier: standard
  reasoning_effort: high
  actual_model: Sonnet 5.5
- id: T04
  title: Define transport contracts and canonical idempotency hash
  depends_on:
  - T03
  parallel_group: contracts
  owner_area: internal/contract/, internal/idempotency/
  deliverables: HTTP/SQS DTOs, strict parsing, canonical JSON, SHA-256 hash, error/status mapping and event envelope
    versions
  done_when: HTTP and SQS vectors hash identically; invalid amounts and reused keys with different content are distinguishable
  agent: codex
  model_tier: standard
  reasoning_effort: medium
- id: T05
  title: Implement OIDC authentication and provider authorization
  depends_on:
  - T01
  - T04
  parallel_group: infrastructure
  owner_area: internal/auth/
  deliverables: JWKS JWT validation, provider claim mapping, internal scopes and authorization middleware
  done_when: Absent, invalid and expired credentials fail; cross-provider reads/replays and internal endpoints are
    forbidden
  agent: claude
  model_tier: standard
  reasoning_effort: high
- id: T06
  title: Implement transactional PostgreSQL repositories
  depends_on:
  - T02
  - T03
  - T04
  parallel_group: core
  owner_area: internal/storage/pg/
  deliverables: pgx transaction boundary, wallet lock, operation/replay lookup, ledger writes, inbox/outbox writes
    and claims
  done_when: Repository operations share one SQL transaction; unique conflicts are classified; row locks are per
    wallet
  agent: codex
  model_tier: standard
  reasoning_effort: high
- id: T07
  title: Implement shared financial use case
  depends_on:
  - T03
  - T04
  - T06
  parallel_group: core
  owner_area: internal/usecase/wagering/, internal/usecase/wallet/
  deliverables: Wallet opening, BET/WIN/LOSS/REFUND/ROLLBACK, idempotent replay, rejection and pending reference
    commits
  done_when: All financial effects, result snapshots and events are atomic; reversal collisions and insufficient
    funds are stable results
  agent: codex
  model_tier: frontier
  reasoning_effort: xhigh
- id: T08
  title: Implement HTTP API and consistent reconciliation
  depends_on:
  - T01
  - T05
  - T07
  parallel_group: delivery
  owner_area: internal/httpapi/
  deliverables: Specified write/read/reconciliation routes, cursor pagination, auth integration and error bodies
  done_when: Routes enforce scopes/provider isolation; replay returns stored balance; reconciliation uses a consistent
    snapshot
  agent: codex
  model_tier: standard
  reasoning_effort: medium
- id: T09
  title: Implement SQS consumer and inbox processing
  depends_on:
  - T01
  - T06
  - T07
  - T12
  parallel_group: delivery
  owner_area: internal/messaging/consumer/
  deliverables: FIFO poll/delete, envelope validation, inbox hash handling, retry/redrive, shutdown visibility release
  done_when: Delete follows durable commit; repeated message and HTTP/SQS crossing produce one financial effect;
    invalid messages reach DLQ
  agent: codex
  model_tier: standard
  reasoning_effort: high
- id: T10
  title: Implement durable reference retry worker
  depends_on:
  - T01
  - T06
  - T07
  parallel_group: delivery
  owner_area: internal/workers/reference/
  deliverables: Lease claims, exponential retry, TTL/attempt exhaustion and terminal rejection events
  done_when: Missing reference survives restart and resolves later or rejects with stable failure code; competing
    workers do not double-apply
  agent: claude
  model_tier: standard
  reasoning_effort: high
- id: T11
  title: Implement transactional outbox publisher
  depends_on:
  - T01
  - T06
  - T12
  parallel_group: delivery
  owner_area: internal/workers/outbox/
  deliverables: Concurrent claims, stable event IDs, SQS publish, lease recovery, backoff, metrics hooks and shutdown
  done_when: Two publishers avoid simultaneous claims; crash before/after publish recovers with same eventId
  agent: codex
  model_tier: standard
  reasoning_effort: high
- id: T12
  title: Provision local infrastructure and test identities
  depends_on:
  - T01
  parallel_group: infrastructure
  owner_area: compose.yaml, Dockerfile, infra/, .env.example
  deliverables: PostgreSQL, provisioned Keycloak, LocalStack/MiniStack inbound FIFO, outbound FIFO, DLQ and policies
  done_when: Clean compose build starts dependencies; realm/clients and queues are provisioned idempotently
  agent: antigravity
  model_tier: economy
  reasoning_effort: medium
- id: T13
  title: Add logs, metrics and health checks
  depends_on:
  - T01
  - T08
  - T09
  - T10
  - T11
  parallel_group: hardening
  owner_area: internal/observability/, internal/httpapi/health/
  deliverables: Structured logs, specified metrics, public live/ready endpoints and reconciliation divergence reporting
  done_when: Readiness checks DB/SQS; required identifiers and metrics appear without sensitive payloads
  agent: antigravity
  model_tier: economy
  reasoning_effort: medium
- id: T14
  title: Write focused domain and contract unit tests
  depends_on:
  - T03
  - T04
  - T07
  parallel_group: verification
  owner_area: internal/domain/*_test.go, internal/idempotency/*_test.go, internal/usecase/*_test.go
  deliverables: Money boundaries, wallet transitions, external kinds, opening, reversals and hash conflict tests
  done_when: Unit suite covers zero policy, overflow, currency mismatch, terminal states and rehydration
  agent: antigravity
  model_tier: economy
  reasoning_effort: medium
- id: T15
  title: Write real DB/SQS integration tests
  depends_on:
  - T07
  - T09
  - T10
  - T11
  - T12
  parallel_group: verification
  owner_area: tests/integration/finance/, tests/integration/messaging/
  deliverables: Container tests for migrations, constraints, ledger, inbox, outbox, retry, DLQ and restart
  done_when: Tests use real PostgreSQL and SQS; failures around commit/delete/publish preserve financial result
  agent: codex
  model_tier: standard
  reasoning_effort: high
- id: T16
  title: Write real IdP and HTTP authorization integration tests
  depends_on:
  - T05
  - T08
  - T12
  parallel_group: verification
  owner_area: tests/integration/auth/, tests/integration/http/
  deliverables: Container IdP token flows, endpoint access matrix, provider isolation and replay security tests
  done_when: Invalid/expired/missing tokens fail without effects; another provider cannot see transactions by either
    lookup
  agent: claude
  model_tier: standard
  reasoning_effort: high
- id: T17
  title: Verify multi-process concurrency and crash recovery
  depends_on:
  - T08
  - T09
  - T10
  - T11
  - T15
  - T16
  parallel_group: system_verification
  owner_area: tests/system/, scripts/faults/
  deliverables: Three independent process scenarios, 50x replay, 80/80 race, independent wallets, cross transport,
    crash points and ledger sum
  done_when: All scenarios prove one debit, no negative balance, recoverable pending/outbox work and final ledger
    reconciliation
  agent: codex
  model_tier: frontier
  reasoning_effort: xhigh
- id: T18
  title: Write reproducible user and architecture documentation
  depends_on:
  - T04
  - T05
  - T12
  parallel_group: documentation
  owner_area: README.md, ARCHITECTURE.md
  deliverables: Setup, env, migrations up/down, auth flow, SQS routing, contracts, design decisions, limitations
    and test commands
  done_when: A clean checkout can follow documented commands; final details are updated after system verification
  agent: antigravity
  model_tier: economy
  reasoning_effort: low
- id: T19
  title: Run final audit and close gaps
  depends_on:
  - T13
  - T14
  - T15
  - T16
  - T17
  - T18
  parallel_group: release_gate
  owner_area: cross-cutting verification and small fixes
  deliverables: gofmt, go test, race, vet, compose smoke, requirements matrix and corrected docs
  done_when: Every mandatory specification item has evidence; outstanding limitations are explicit
  agent: claude
  model_tier: frontier
  reasoning_effort: high
