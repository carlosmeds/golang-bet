services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://wagering:wagering_password@postgres:5432/wagering?sslmode=disable
      - AWS_REGION=us-east-1
      - SQS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - WAGER_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - EVENT_QUEUE_URL=http://localstack:4566/000000000000/wager-events.fifo
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/wagering
      - OIDC_AUDIENCE=account
      - HTTP_ADDR=:8081
      - SHUTDOWN_TIMEOUT=15s
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_password
      POSTGRES_DB: wagering
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: ministackorg/ministack:1.5.18
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
    volumes:
      - "./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4566/_localstack/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - "./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/wagering HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'wagering'"]
      interval: 10s
      timeout: 5s
      retries: 10
