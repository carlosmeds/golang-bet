services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://wagering:wagering_password@postgres:5432/wagering?sslmode=disable
      - AWS_REGION=us-east-1
      # The broker is reachable only through the authenticating gateway, and the
      # service signs with its own least-privilege identity (no static root key).
      - SQS_ENDPOINT=http://sqs-gateway:4566
      - AWS_SHARED_CREDENTIALS_FILE=/broker-credentials/credentials
      - AWS_PROFILE=wagering-app
      - WAGER_QUEUE_URL=http://sqs-gateway:4566/000000000000/wager-transactions.fifo
      - EVENT_QUEUE_URL=http://sqs-gateway:4566/000000000000/wager-events.fifo
      - OIDC_ISSUER_URL=http://localhost:8082/realms/wagering
      - OIDC_JWKS_URL=http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      - OIDC_AUDIENCE=wagering-api
      - HTTP_ADDR=:8081
      - SHUTDOWN_TIMEOUT=15s
    volumes:
      - "broker-credentials:/broker-credentials:ro"
    depends_on:
      postgres:
        condition: service_healthy
      sqs-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_password
      POSTGRES_DB: wagering
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MiniStack broker. Not published: it is reachable only through sqs-gateway,
  # because MiniStack grants root to the "test" key and to unsigned requests.
  # AUTH=true makes it enforce IAM identity and queue policies for IAM users.
  # Healthy only after init-sqs.sh has completed (fail closed): the script writes
  # /run/provision/ready (tmpfs, so a stale marker never survives a restart).
  localstack:
    image: ministackorg/ministack:1.5.18
    environment:
      - DEBUG=1
      - AUTH=true
      - AWS_ACCESS_KEY_ID=broker-root
      - AWS_SECRET_ACCESS_KEY=broker-root-secret
    tmpfs:
      - /run/provision
    volumes:
      - "./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh"
      - "broker-credentials:/broker-credentials"
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/provision/ready && python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4566/_localstack/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Only door to the broker: forwards requests signed by a provisioned IAM user.
  sqs-gateway:
    image: nginx:1.27-alpine
    ports:
      - "4566:4566"
    volumes:
      - "./infra/localstack/gateway.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - "./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/wagering HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'wagering'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # AWS shared-credentials profiles written by init-sqs.sh (wagering-app is the
  # service's; the others are for the producer and for tests).
  broker-credentials:
